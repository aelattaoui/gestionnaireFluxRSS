name: RSS to Discord

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run RSS Script
        env:
          DISCORD_WEBHOOK_BIGDATA: ${{ secrets.DISCORD_WEBHOOK_BIGDATA }}
          DISCORD_WEBHOOK_CYBERSECURITE: ${{ secrets.DISCORD_WEBHOOK_CYBERSECURITE }}
          DISCORD_WEBHOOK_DEVELOPPEMENT: ${{ secrets.DISCORD_WEBHOOK_DEVELOPPEMENT }}
          DISCORD_WEBHOOK_MANAGEMENT: ${{ secrets.DISCORD_WEBHOOK_MANAGEMENT }}
          DISCORD_WEBHOOK_MOBILITE: ${{ secrets.DISCORD_WEBHOOK_MOBILITE }}
          DISCORD_WEBHOOK_OPTIMISATION_SI: ${{ secrets.DISCORD_WEBHOOK_OPTIMISATION_SI }}
          DISCORD_WEBHOOK_SI_ENVIRONNEMENT: ${{ secrets.DISCORD_WEBHOOK_SI_ENVIRONNEMENT }}
          DISCORD_WEBHOOK_IA: ${{ secrets.DISCORD_WEBHOOK_IA }}
          DISCORD_WEBHOOK_BLOCKCHAIN: ${{ secrets.DISCORD_WEBHOOK_BLOCKCHAIN }}
        run: python fetch_rss.py

      - name: Commit & Push updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Chore: Update seen articles"
            git push
          fi
